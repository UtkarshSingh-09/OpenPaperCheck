[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openpapercheck"
version = "0.1.0.dev0"
description = "Fast, honest scholarly retraction and reference integrity checker with verified open labels."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "OpenPaperCheck Contributors" }
]
keywords = ["retraction", "crossref", "academic-integrity", "open-science", "doi-checker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Core dependencies (minimal: zero Postgres, zero FastAPI)
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/UtkarshSingh-09/OpenPaperCheck"
Documentation = "https://github.com/UtkarshSingh-09/OpenPaperCheck#readme"
Repository = "https://github.com/UtkarshSingh-09/OpenPaperCheck.git"
Issues = "https://github.com/UtkarshSingh-09/OpenPaperCheck/issues"

[project.optional-dependencies]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "structlog>=24.0.0",
    "authlib>=1.3.0",
    "slowapi>=0.1.9",
    "orjson>=3.10.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
    "pyright>=1.1.380",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
    "pyright>=1.1.380",
]

[project.scripts]
opc = "openpapercheck.cli:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["B008", "E501"]

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__"]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=openpapercheck --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
