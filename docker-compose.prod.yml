# ==============================================================================
# OpenPaperCheck Production Docker Compose Stack
# Architecture: Caddy (TLS/Proxy) -> Next.js (Web) + FastAPI (API) + PostgreSQL (DB)
# ==============================================================================

services:
  caddy:
    image: caddy:2.8-alpine
    container_name: opc-caddy-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-openpapercheck.org}
      - ACME_EMAIL=${ACME_EMAIL:-admin@openpapercheck.org}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - opc_network

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opc-web-prod
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - API_URL=http://api:8000
      - NEXT_PUBLIC_API_URL=https://${DOMAIN:-openpapercheck.org}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - opc_network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.2"
          memory: 256M

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opc-api-prod
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - OPC_ENV=prod
      - SECRET_KEY=${SECRET_KEY}
      - CROSSREF_MAILTO=${CROSSREF_MAILTO:-contact@openpapercheck.org}
      - DATABASE_URL=postgresql+psycopg://opc:${POSTGRES_PASSWORD}@db:5432/opc
      - PYTHONUNBUFFERED=1
    volumes:
      - opc_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - opc_network
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
        reservations:
          cpus: "0.25"
          memory: 512M

  db:
    image: postgres:16-alpine
    container_name: opc-db-prod
    restart: unless-stopped
    environment:
      - POSTGRES_USER=opc
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-opc-prod-secure-password}
      - POSTGRES_DB=opc
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - opc_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opc -d opc"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  opc_data:

networks:
  opc_network:
    driver: bridge
