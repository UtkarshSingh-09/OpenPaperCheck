services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opc-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OPC_ENV=dev
      - CROSSREF_MAILTO=${CROSSREF_MAILTO:-dev@openpapercheck.org}
      - DATABASE_URL=postgresql+psycopg://opc:opc@db:5432/opc
      - PYTHONUNBUFFERED=1
    volumes:
      - opc_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opc-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_URL=http://api:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    container_name: opc-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=opc
      - POSTGRES_PASSWORD=opc
      - POSTGRES_DB=opc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opc -d opc"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  opc_data:
    driver: local
